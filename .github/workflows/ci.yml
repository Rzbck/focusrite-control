name: module-ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - name: Install dependencies
        shell: bash
        run: |
          if [ -f yarn.lock ]; then
            yarn install --immutable
          else
            yarn install
          fi
      - run: yarn check-format
      - run: yarn lint
      - run: yarn check
      - run: yarn test
      - run: yarn companion-module-build
